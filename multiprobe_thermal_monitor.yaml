# Flagship — firmware principale (ESP32-S3 Super Mini + 3 sonde di
# temperatura + pubblicazione MQTT verso Home Assistant).
#
# LOGICA: le 3 sonde DS18B20 vengono lette insieme ogni 3 s; ogni 10 letture
# (30 s) viene pubblicata su MQTT la MEDIANA delle ultime 10. Con il
# ponticello debug su GND all'avvio: lettura ogni 2 s, pubblicazione a ogni
# lettura, piu' i valori grezzi. Stessa logica, parametri diversi. Home Assistant scopre le entità da solo via
# MQTT discovery (nessuna entità da dichiarare a mano nel suo
# configuration.yaml).
#
# Perché la mediana e non la media: il filtro non serve a migliorare
# l'accuratezza (i ±0.5 °C della DS18B20 sono errore sistematico di
# calibrazione, mediare non li tocca), serve a scartare le letture sballate
# che un bus 1-Wire disturbato può produrre. Un singolo campione spazzatura
# non sposta la mediana, mentre trascinerebbe la media.
#
# Cablaggio: DOCS/wiring.yaml (WireViz). Ogni sonda ha il proprio bus 1-Wire
# su un GPIO dedicato, con la propria resistenza di pull-up da 4.7 kOhm verso
# 3V3; alimentazione (3V3 e GND) condivisa dalle tre. Con un solo device per
# bus gli indirizzi a 64 bit delle DS18B20 non servono: ESPHome li
# auto-seleziona. L'associazione sonda/entità la decide il pin.
#
# Varianti di sviluppo/test: vedi bench/ (vuota per ora).

substitutions:
  device_name: multiprobe-thermal-monitor

  # Campionamento e pubblicazione, in due modalita' scelte AL BOOT dal
  # ponticello su debug_pin. La logica e' la stessa: cambiano solo i numeri.
  #
  #                    normale   debug
  #   lettura sonde    3 s       2 s
  #   pubblica ogni    10 letture 1 lettura  (30 s / 2 s)
  #   valori grezzi    no        si'
  #
  # La mediana e' sempre sulle ultime window_size letture.
  #
  # sample_ms minimo 1000: a 12 bit la conversione DS18B20 dura 750 ms, e con
  # un intervallo piu' corto ogni lettura verrebbe annullata dalla successiva.
  sample_ms_normal: "3000"
  sample_ms_debug: "2000"
  publish_every_normal: "10"
  publish_every_debug: "1"
  window_size: "10"

  # Ponticello verso GND = modalita' debug; scollegato = normale. Letto solo
  # all'avvio: dopo averlo spostato serve un riavvio. Non GPIO4 come negli
  # altri progetti: qui GPIO4 e' la sonda 1.
  debug_pin: GPIO7

  # Un bus 1-Wire DEDICATO per ogni sonda, invece di un unico bus condiviso.
  # Ogni bus vuole la sua resistenza di pull-up da 4.7 kOhm verso 3V3.
  # Pin adiacenti sull'header della Super Mini, tutti liberi e nessuno di
  # strapping (GPIO3 lo e', per questo si parte da GPIO4).
  probe_1_pin: GPIO4
  probe_2_pin: GPIO5
  probe_3_pin: GPIO6

  # LED RGB onboard WS2812 (condiviso col LED rosso della scheda). Pin
  # confermato sulla Super Mini, vedi ../esp32-S3-from-china. Lo pilota il
  # modulino common/status_led.yaml come indicatore di stato.
  rgb_led_pin: GPIO48

  # Heartbeat molto tenue: sta acceso in una stanza h24, deve confermare che
  # la scheda e' viva senza fare da lucina notturna. Gli avvisi invece
  # devono farsi notare.
  led_brightness_ok: "8%"
  led_brightness_alert: "40%"

# Indicatore di stato sul LED RGB onboard. Codice colore, precedenza e
# limiti sono documentati in testa al modulino.
# Il contratto e' il global led_fault (bool). WiFi e MQTT li rileva il
# modulo da solo; qui sotto, nel blocco interval, si decide solo cio' che il
# modulo non puo' sapere: se una sonda e' muta.
packages:
  status_led: !include
    file: common/status_led.yaml
    vars:
      led_id: onboard_led
      led_pin: ${rgb_led_pin}
      led_brightness_ok: ${led_brightness_ok}
      led_brightness_alert: ${led_brightness_alert}

esphome:
  name: ${device_name}
  friendly_name: "Multiprobe Thermal Monitor"
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            binary_sensor.is_on: debug_mode_sensor
          then:
            - globals.set:
                id: debug_mode
                value: 'true'
            - globals.set:
                id: sample_ms
                value: "${sample_ms_debug}"
            - globals.set:
                id: publish_every
                value: "${publish_every_debug}"
            - logger.log: "DEBUG MODE: lettura ogni 2 s, pubblica ogni lettura + valori grezzi"
          else:
            - logger.log: "NORMAL MODE: lettura ogni 3 s, pubblica ogni 30 s"
      - script.execute: sample_loop

binary_sensor:
  - platform: gpio
    id: debug_mode_sensor
    pin:
      number: ${debug_pin}
      mode: INPUT_PULLUP
      inverted: true  # collegato a GND = debug
    internal: true

script:
  # Ciclo di lettura: aggiorna le tre sonde insieme, poi aspetta sample_ms.
  # Stesso schema di do_drain_cycle in esp32-tank-empty-controller: il valore
  # e' un global letto a runtime, quindi il boot puo' cambiarlo.
  - id: sample_loop
    mode: single
    then:
      - while:
          condition:
            lambda: 'return true;'
          then:
            - component.update: sonda_1
            - component.update: sonda_2
            - component.update: sonda_3
            - delay: !lambda 'return id(sample_ms);'

# Scheda: ESP32-S3 "Super Mini" di importazione, caratterizzata con esptool
# nel repo ../esp32-S3-from-china (QFN56 rev v0.2, 4MB flash XMC, 2MB PSRAM
# quad, USB nativo USB-Serial/JTAG senza bridge UART esterno).
# PSRAM non dichiarata di proposito: qui non serve a nulla e costa RAM
# interna per il mapping.
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 4MB
  framework:
    type: esp-idf

# USB_SERIAL_JTAG obbligatorio su questa board: non c'è bridge UART, senza
# questa riga i log non escono da nessuna parte.
logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Se il WiFi non è raggiungibile la board espone una rete propria da cui
  # riconfigurarla, invece di restare irraggiungibile.
  ap:
    # Non "${device_name}-fallback": un SSID può essere al massimo 32
    # caratteri e il nome completo sfora.
    ssid: "thermal-monitor-fallback"

captive_portal:

ota:
  - platform: esphome

# Trasporto scelto: MQTT (non l'API nativa ESPHome). Home Assistant riceve
# le entità via MQTT discovery, quindi serve il broker + l'integrazione MQTT
# configurata in HA.
#
# NOTA: senza il blocco `api:` la dashboard ESPHome non può mostrare i log
# via rete (restano disponibili via USB e sul topic .../debug) e HA non usa
# l'integrazione nativa ESPHome. È una conseguenza voluta della scelta MQTT,
# non una dimenticanza: api: e mqtt: possono coesistere, se in futuro serve.
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  # discovery: true e discovery_prefix: homeassistant sono i default —
  # lasciati impliciti apposta per non duplicare valori già corretti.
  #
  # birth/will message di default pubblicano online/offline su
  # ${device_name}/status: è ciò che rende le entità "non disponibili" in HA
  # quando la board si stacca, invece di mostrare l'ultimo valore per sempre.

# Un bus 1-Wire dedicato per sonda, invece di un unico bus condiviso da
# tutte e tre. Costa due GPIO e due resistenze in piu' (ne abbiamo 13
# liberi), e in cambio:
#
#   - NIENTE indirizzi a 64 bit da ricavare dai log e incollare qui: con un
#     solo device sul bus, OneWireDevice::check_address_() lo auto-seleziona
#     (one_wire.cpp:22-35). Con piu' device sarebbe obbligatorio dichiararli.
#   - Sostituire una sonda guasta diventa un'operazione puramente fisica:
#     stacchi e attacchi. Con gli indirizzi servirebbe rileggere i log e
#     riflashare.
#   - L'associazione sonda/entita' e' fissata dal CABLAGGIO, non da un numero
#     a 64 bit: "Sonda 2 = GPIO5" si verifica guardando la scheda.
#   - Un guasto isola: una sonda che tiene la linea dati bassa azzera solo il
#     proprio bus. Sul bus condiviso avrebbe fatto sparire tutte e tre.
#   - Ogni tratta e' punto-punto, quindi il problema della topologia a stella
#     (riflessioni, CRC errati) semplicemente non si pone.
one_wire:
  - platform: gpio
    id: probe_1_bus
    pin: ${probe_1_pin}

  - platform: gpio
    id: probe_2_bus
    pin: ${probe_2_pin}

  - platform: gpio
    id: probe_3_bus
    pin: ${probe_3_pin}

# Diagnostica: poche entita', tutte in categoria "diagnostic" in Home
# Assistant (separate dalle temperature). Ognuna risponde a una domanda
# precisa quando qualcosa non va:
#   - uptime             si e' riavviata?
#   - causa del reset    perche'? (brownout = alimentazione/cavo, panic = crash)
#   - segnale WiFi       la connessione e' debole? (antenna, posizione)
#   - letture fallite    il bus sta degradando prima di rompersi del tutto?
#   - versione ESPHome   quale firmware gira dopo un aggiornamento OTA?
debug:
  # Serve solo per la causa del reset, pubblicata una volta all'avvio.
  # "never": niente log periodici di heap e simili.
  update_interval: never

globals:
  # Parametri di modalita': inizializzati ai valori normali, sovrascritti al
  # boot se il ponticello debug e' inserito.
  - id: debug_mode
    type: bool
    initial_value: 'false'
  - id: sample_ms
    type: uint32_t
    initial_value: "${sample_ms_normal}"
  - id: publish_every
    type: uint32_t
    initial_value: "${publish_every_normal}"

  - id: read_errors
    type: uint32_t
    initial_value: '0'
    # Letture grezze fallite (NaN) delle tre sonde dall'avvio. La mediana
    # nasconde gli errori isolati: questo contatore li rende visibili, cosi'
    # un bus che degrada si nota prima che la sonda smetta del tutto.
    # Si azzera a ogni riavvio (niente scritture su flash).

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

  - platform: template
    name: "Letture fallite"
    lambda: 'return id(read_errors);'
    update_interval: 60s
    accuracy_decimals: 0
    # total_increasing: HA gestisce da solo l'azzeramento dopo un riavvio.
    state_class: total_increasing
    entity_category: diagnostic

  # ---------------------------------------------------------------------
  # SONDE
  # ---------------------------------------------------------------------
  # Ogni sonda sta sul proprio bus (one_wire_id), quindi NON serve dichiarare
  # l'indirizzo: essendo l'unico device sul bus, viene auto-selezionato.
  # L'associazione sonda/entita' la decide il pin a cui l'hai collegata.
  #
  # Le letture le comanda lo script sample_loop (update_interval: never), che
  # aggiorna le tre sonde nello stesso ciclo: le finestre della mediana
  # restano allineate e i tre valori pubblicati coprono lo stesso intervallo.
  #
  # Filtri: la mediana si aggiorna a ogni lettura (send_every: 1); il filtro
  # lambda successivo lascia passare un valore ogni publish_every letture.
  # In modalita' normale il primo valore esce alla 10a lettura, quindi a
  # finestra piena.
  #
  # Se una sonda non compare nei log, il problema e' nel cablaggio di QUELLA
  # tratta (pull-up assente sul suo pin, massa, o sonda guasta) — le altre
  # due continuano a funzionare, ed e' proprio il vantaggio dei bus separati.
  - platform: dallas_temp
    id: sonda_1
    one_wire_id: probe_1_bus
    name: "Sonda 1"
    update_interval: never
    resolution: 12
    on_raw_value:
      # Conta le letture fallite PRIMA della mediana, che le nasconderebbe.
      - lambda: 'if (isnan(x)) id(read_errors)++;'
      - if:
          condition:
            lambda: 'return id(debug_mode);'
          then:
            - sensor.template.publish:
                id: sonda_1_raw
                state: !lambda 'return x;'
    filters:
      - median:
          window_size: ${window_size}
          send_every: 1
          send_first_at: 1
      - lambda: |-
          static uint32_t n = 0;
          if (++n % id(publish_every) != 0) return {};
          return x;

  - platform: template
    id: sonda_1_raw
    name: "Sonda 1 grezzo"
    # Pubblicato solo in modalita' debug; in normale resta vuoto.
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic

  - platform: dallas_temp
    id: sonda_2
    one_wire_id: probe_2_bus
    name: "Sonda 2"
    update_interval: never
    resolution: 12
    on_raw_value:
      # Conta le letture fallite PRIMA della mediana, che le nasconderebbe.
      - lambda: 'if (isnan(x)) id(read_errors)++;'
      - if:
          condition:
            lambda: 'return id(debug_mode);'
          then:
            - sensor.template.publish:
                id: sonda_2_raw
                state: !lambda 'return x;'
    filters:
      - median:
          window_size: ${window_size}
          send_every: 1
          send_first_at: 1
      - lambda: |-
          static uint32_t n = 0;
          if (++n % id(publish_every) != 0) return {};
          return x;

  - platform: template
    id: sonda_2_raw
    name: "Sonda 2 grezzo"
    # Pubblicato solo in modalita' debug; in normale resta vuoto.
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic

  - platform: dallas_temp
    id: sonda_3
    one_wire_id: probe_3_bus
    name: "Sonda 3"
    update_interval: never
    resolution: 12
    on_raw_value:
      # Conta le letture fallite PRIMA della mediana, che le nasconderebbe.
      - lambda: 'if (isnan(x)) id(read_errors)++;'
      - if:
          condition:
            lambda: 'return id(debug_mode);'
          then:
            - sensor.template.publish:
                id: sonda_3_raw
                state: !lambda 'return x;'
    filters:
      - median:
          window_size: ${window_size}
          send_every: 1
          send_first_at: 1
      - lambda: |-
          static uint32_t n = 0;
          if (++n % id(publish_every) != 0) return {};
          return x;

  - platform: template
    id: sonda_3_raw
    name: "Sonda 3 grezzo"
    # Pubblicato solo in modalita' debug; in normale resta vuoto.
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 2
    update_interval: never
    entity_category: diagnostic
  # ---------------------------------------------------------------------

text_sensor:
  - platform: version
    name: "ESPHome version"

  - platform: debug
    reset_reason:
      name: "Causa ultimo riavvio"


# Alza il flag di guasto che il modulino LED traduce in rosso lampeggiante.
# E' l'unico punto in cui questo firmware decide COSA sia un guasto: il
# modulino non sa nulla di sonde (e non gli serve, il rosso dice CHE
# qualcosa non va, non cosa — il dettaglio sta nei log e in HA).
#
# Perche' has_state() e non solo isnan(): prima della prima pubblicazione lo
# stato di un sensore E' NaN. Senza la guardia, per i primi 30s dopo ogni
# boot il LED segnalerebbe un guasto su un impianto perfettamente sano.
#
# Cosa fa scattare davvero l'avviso: il filtro median scarta i NaN dalla
# finestra e pubblica NaN solo se TUTTI e 10 i campioni lo sono
# (filter.cpp:51-57). Quindi il LED non si accende per un glitch occasionale
# sul bus, ma solo per una sonda muta per l'intera finestra — che e'
# esattamente la condizione che vale la pena segnalare.
interval:
  - interval: 5s
    then:
      - lambda: |-
          id(led_fault) =
              (id(sonda_1).has_state() && isnan(id(sonda_1).state)) ||
              (id(sonda_2).has_state() && isnan(id(sonda_2).state)) ||
              (id(sonda_3).has_state() && isnan(id(sonda_3).state));
