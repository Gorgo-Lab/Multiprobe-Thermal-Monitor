metadata:
  title: Multiprobe Thermal Monitor — Wiring (3 DS18B20, un bus 1-Wire per sonda)
  description: >
    ESP32-S3 Super Mini con tre sonde DS18B20, ognuna sul proprio bus 1-Wire
    (GPIO4, GPIO5, GPIO6) con il proprio pull-up da 4.7 kOhm verso 3V3.
    Alimentazione delle sonde condivisa sui nodi 3V3 e GND. La scheda si
    alimenta dalla presa USB-C, non disegnata perche non si salda. Le note
    sono appunti da banco; i riferimenti tra parentesi quadre rimandano alle
    sezioni di DOCS/note-hardware.md.
  avvertenze: >
    Solo nel sorgente (WireViz non le mostra). Le avvertenze da banco sono
    nelle note del diagramma; le spiegazioni in DOCS/note-hardware.md.

connectors:
  ESP32:
    type: ESP32-S3 Super Mini
    subtype: alimentata da USB-C
    pinlabels: [GND, GPIO4, GPIO5, GPIO6, GPIO13, '3V3', '5V']
    notes: |
      USB-C da caricatore: non si salda [alimentazione]
      cavo USB corto o spesso [cavo]
      5V: SOLO condensatore, mai altra sorgente
      GPIO4/5/6 = sonde 1/2/3 [pin-entita]
      un bus per sonda [bus-separati]

  N_3V3:
    style: simple
    type: Nodo 3V3
    subtype: filo bus su millefori
    color: RD
    notes: |
      3V3 scheda + 3 VDD + 3 pull-up [nodi]

  N_GND:
    style: simple
    type: Nodo GND
    subtype: filo bus su millefori
    color: BK
    notes: |
      GND scheda + 3 GND sonde [nodi]

  R_PULLUP_1: &pullup
    type: Pull-up
    subtype: 4.7 kOhm 1/4W
    pinlabels: [A, B]
    notes: |
      una per bus, lato scheda [pull-up]

  R_PULLUP_2:
    <<: *pullup

  R_PULLUP_3:
    <<: *pullup

  SONDA_1: &sonda_ds18b20
    type: DS18B20 waterproof
    subtype: cavo 3 fili
    pinlabels: [GND, DQ, VDD]
    notes: |
      VDD a 3.3V, NON 5V [3v3]
      3 fili, non parassita [parassita]
      verifica colori prima [colori-sonde]
      etichetta il cavo: sonda 1

  SONDA_2:
    <<: *sonda_ds18b20
    notes: |
      VDD a 3.3V, NON 5V [3v3]
      3 fili, non parassita [parassita]
      verifica colori prima [colori-sonde]
      etichetta il cavo: sonda 2

  SONDA_3:
    <<: *sonda_ds18b20
    notes: |
      VDD a 3.3V, NON 5V [3v3]
      3 fili, non parassita [parassita]
      verifica colori prima [colori-sonde]
      etichetta il cavo: sonda 3

  JP_DEBUG:
    type: Ponticello debug
    subtype: header 2 pin + jumper
    pinlabels: [A, B]
    notes: |
      inserito all'avvio = modalita' debug
      su millefori, NON sui pin: 3V3 in mezzo [debug]

  C_BULK:
    type: Elettrolitico
    subtype: 100 uF low-ESR, min 10V
    pinlabels: ['+', '-']
    notes: |
      POLARIZZATO: banda = negativo [polarita]
      sulla scheda, 2 pontini [condensatore]

cables:
  W1:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [RD]
    notes: pin 3V3 → nodo 3V3

  W2:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [BK]
    notes: pin GND → nodo GND

  W3:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [YE]
    notes: sonda 1, filo giallo

  W4:
    wirecount: 2
    gauge: 0.25 mm2
    colors: [BK, RD]
    notes: |
      sonda 1, nero e rosso
      stesso cavo di W3 [colori-sonde]

  W5:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [YE]
    notes: sonda 2, filo giallo

  W6:
    wirecount: 2
    gauge: 0.25 mm2
    colors: [BK, RD]
    notes: sonda 2, stesso cavo di W5

  W7:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [YE]
    notes: sonda 3, filo giallo

  W8:
    wirecount: 2
    gauge: 0.25 mm2
    colors: [BK, RD]
    notes: sonda 3, stesso cavo di W7

  W9:
    wirecount: 1
    colors: [YE]
    notes: reoforo, non un cavo

  W10:
    wirecount: 1
    colors: [RD]
    notes: reoforo, non un cavo

  W11:
    wirecount: 1
    colors: [YE]

  W12:
    wirecount: 1
    colors: [RD]

  W13:
    wirecount: 1
    colors: [YE]

  W14:
    wirecount: 1
    colors: [RD]

  W15:
    wirecount: 1
    colors: [RD]
    notes: + del condensatore

  W16:
    wirecount: 1
    colors: [BK]
    notes: − (banda) del condensatore


  W17:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [WH]
    notes: GPIO13 → ponticello

  W18:
    wirecount: 1
    gauge: 0.25 mm2
    colors: [BK]
    notes: ponticello → nodo GND

connections:
  -
    - ESP32: ['3V3']
    - W1: [1]
    - [N_3V3.F1]

  -
    - ESP32: [GND]
    - W2: [1]
    - [N_GND.F2]

  -
    - ESP32: [GPIO4]
    - W3: [1]
    - SONDA_1: [DQ]

  -
    - [N_GND.F2, N_3V3.F1]
    - W4: [1-2]
    - SONDA_1: [GND, VDD]

  -
    - ESP32: [GPIO5]
    - W5: [1]
    - SONDA_2: [DQ]

  -
    - [N_GND.F2, N_3V3.F1]
    - W6: [1-2]
    - SONDA_2: [GND, VDD]

  -
    - ESP32: [GPIO6]
    - W7: [1]
    - SONDA_3: [DQ]

  -
    - [N_GND.F2, N_3V3.F1]
    - W8: [1-2]
    - SONDA_3: [GND, VDD]

  -
    - ESP32: [GPIO4]
    - W9: [1]
    - R_PULLUP_1: [A]

  -
    - R_PULLUP_1: [B]
    - W10: [1]
    - [N_3V3.F1]

  -
    - ESP32: [GPIO5]
    - W11: [1]
    - R_PULLUP_2: [A]

  -
    - R_PULLUP_2: [B]
    - W12: [1]
    - [N_3V3.F1]

  -
    - ESP32: [GPIO6]
    - W13: [1]
    - R_PULLUP_3: [A]

  -
    - R_PULLUP_3: [B]
    - W14: [1]
    - [N_3V3.F1]

  -
    - ESP32: ['5V']
    - W15: [1]
    - C_BULK: ['+']

  -
    - ESP32: [GND]
    - W16: [1]
    - C_BULK: ['-']

  -
    - ESP32: [GPIO13]
    - W17: [1]
    - JP_DEBUG: [A]

  -
    - JP_DEBUG: [B]
    - W18: [1]
    - [N_GND.F2]
