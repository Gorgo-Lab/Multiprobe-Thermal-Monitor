# Broker MQTT di debug: vedere i messaggi della scheda senza Home Assistant.
# Solo per test sulla rete locale: accesso anonimo, nessuna persistenza.
#
# Senza credenziali sul broker, quelle in secrets.yaml vengono ignorate:
# l'ESP si collega comunque, non serve riflashare per cambiarle.

# Mosquitto 2.x di default ascolta solo in localhost: senza questa riga
# l'ESP non riesce a collegarsi.
listener 1883 0.0.0.0
allow_anonymous true
